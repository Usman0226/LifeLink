<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>LifeLink Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #f7f7f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      height: 85%;
      display: flex;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }


    .left {
      flex: 1;
      background: linear-gradient(to bottom right, #b63232, #d95d5d);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .left img {
      max-width: 100%;
      height: auto;
    }

    .right {
      flex: 1;
      padding: 80px 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .right .logo {
      width: 150px;
      margin-bottom: 25px;
    }

    .right h2 {
      font-size: 26px;
      color: #333;
      margin-bottom: 35px;
    }

    form {
      width: 100%;
      max-width: 350px;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #c34848;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      transition: border 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #a83232;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #a83232;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #912b2b;
    }

    .form-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #222;
    }

    .form-links a {
      text-decoration: none;
      font-weight: bold;
      color: #000;
    }

    .form-links a:hover {
      color: #a83232;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 95vw;
        border-radius: 0;
      }

      .left,
      .right {
        padding: 30px;
      }

      .right {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="left">
      <img src="Assets/pic.png" alt="ALT">
    </div>

    <div class="right">
      <img src="Assets/LL.jpg" alt="LifeLink Logo" class="logo">
      <h2>Login</h2>
      <form>
        <div class="form-group">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Password" required>
        </div>
        <button class="btn" type="submit">LOGIN</button>
      </form>
      <div class="form-links">
        <p><a href="#">Forgot Password?</a></p>
        <p>Don’t have an account? <a href="SignUp.html">Sign Up</a></p>
      </div>
    </div>
  </div>

</body>

</html>
