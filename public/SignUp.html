<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink</title>
    <script src="https://kit.fontawesome.com/62301ddb39.js" crossorigin="anonymous"></script>
   
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', Arial, sans-serif;
}

body,
html {
    width: 100%;
    height: 100%;
}

#SignUp {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}


.container {
    width: 90%;
    max-width: 1200px;
    height: 85%;
    display: flex;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

p {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
}

#pic {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 50%;
    background: linear-gradient(to bottom, #e75d5d, rgba(214, 214, 214, 0.868));
    border-radius: 22px;
    /* padding: 20px; */
}

.form {
    width: 50%;
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background-color: white;
}

.title {
    font-size: 28px;
    font-weight: bold;
    color: #333;
    margin-bottom: 30px;
    text-align: center;
}

.details {
    display: flex;
    flex-direction: column;
    margin-bottom: 18px;
}

.sub_title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6.5px;
    margin-left: 2.3%;
    color: #333;
}


.details i {
    margin-right: 6px;
    color: #f44336;
}

.sty {
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
}


.btn {
    align-self: center;
    background-color: #a23238;
    color: #fcfbfb;
    padding: 14px;
    border: none;
    width: 100%;
    max-width: 320px;
    border-radius: 22px;
    font-weight: 700;
    font-size: 15px;
}

.btn:hover {
    background-color: #a83238;
}


.link {
    color: #000000;
    font-weight: 600;
    text-decoration: none;
}

.link:hover {
    color: #a23238;
    border-bottom: 1px solid rgb(33, 15, 15);
}


#btm {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    margin-bottom: 30px;
}

#pic img {
    width: 70%;
    height: 60%;
    object-fit: cover;
    /* position: fixed; */
    /* bottom: 47px; */
}

.sty:focus,
.sty:hover {
    border-color: #a23238;
    box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.2);
}


@media (max-width: 700px) {
    .container {
        height: auto;
        flex-direction: column;
        border-radius: 0;
        box-shadow: none;
    }

    #pic {
        margin-top: 11%;
        width: 100%;
        height: 250px;
        border-radius: 22px ;
    }

    #pic img {
        width: 50%;
        height: auto;
        object-fit: contain;
    }

    .form {
        width: 100%;
        padding: 0 !important;
        border-radius: 0 0 22px 22px;
    }

    .btn {
        width: 100%;
    }
}

@media (max-width: 600px) {
    .title {
        font-size: 22px;
    }

    .sty {
        font-size: 14px;
        padding: 10px 12px;
    }

    .form {
        width: 100%;
        padding: 0 !important;
        border-radius: 0 0 22px 22px;
    }

    .btn {
        font-size: 14px;
        padding: 12px;
    }

    .sub_title {
        font-size: 13px;
    }

    #pic {
        height: 200px;
    }

    #pic img {
        width: 60%;
    }
}
    </style>
</head>

<body>
    <div id="SignUp">

        <div class="container">
            <div id="pic">
                <img src="Assets/pic.png" alt="Donation">
            </div>
            <div class="form">
                <h2></h2>
                <p class="title">SignUp</p>
            <div class="inputs">
                <form action="">
                    <div class="details">
                        <label class="sub_title" for="name"><i class="fa-solid fa-user"></i>Name</label>
                        <input name="name" placeholder="Enter your full name" class="sty" type="text" id="name">
                    </div>
                    <div class="details">
                        <label class="sub_title" for="email"> <i class="fa-solid fa-envelope"></i>Email</label>
                        <input placeholder="Enter your email" id="email" class="sty" type="email">
                    </div>
                    <div class="details">
                        <label class="sub_title" for="password"> <i class="fas fa-lock"></i> Password</label>
                        <input placeholder="Enter your password" id="password" class="sty" type="password">
                    </div>
                    <div class="details">
                        <label class="sub_title" for="date"> <i class="fa-solid fa-calendar"></i> Date Of Birth</label>
                        <input placeholder="Date Of Birth" id="date" class="sty" type="date">
                    </div>
                    <div id="btm">
                        <button class="btn">Sign Up</button>
                        <p>Have an Account? <a class="link" href="LOGIN.html">Login Here!</a>
                        </a></p>
                    </div><a class="link" href=""></a>

            </div>
                </form>
            </div>
            <a class="link" href=""></a>
        </div>
    </div>
</body>

</html>
