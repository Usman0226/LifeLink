<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      height: 85%;
      display: flex;
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .left {
      width: 50%;
      background: linear-gradient(to bottom, #e75d5d, rgba(214, 214, 214, 0.868));
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 22px;
    }

    .left img {
      width: 70%;
      height: 60%;
      object-fit: cover;
    }

    .right {
      width: 50%;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      background-color: white;
    }

    .logo {
      width: 30%;
      height: auto;
      align-self: center;
    }

    .right h2 {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    form {
      width: 100%;

      display: flex;
      justify-content: center;
      flex-direction: column;
    }

    .form-group, .form-group1 {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group i,#lock{
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #f44336;
    }

    .form-group input, .form-group1 input {
      width: 100%;
      padding: 12px 14px 12px 38px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 28px;
      transition: border 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group input:hover{
      border-color: #a23238;
      box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.2);
    }
    #box:hover,
    #box:focus-within {
      border-color: #a23238;
      box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.2);
     }
    .btn {
      width: 100%;
      max-width: 320px;
      margin: 10px auto 0;
      padding: 14px;
      background-color: #a23238;
      color: white;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 28px;
      cursor: pointer;
      transition: background 0.3s;
      display: block;
    }

    .btn:hover {
      background-color: #a83238;
    }

    .form-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #222;
    }

    .form-links a {
      text-decoration: none;
      font-weight: 600;
      color: #000;
    }

    .form-links a:hover {
      color: #a23238;
      border-bottom: 1px solid rgb(33, 15, 15);
    }

    #pass {
      margin-bottom: 7px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        height: auto;
        width: 95%;
        border-radius: 0;
        box-shadow: none;
      }

      .left {
        width: 100%;
        height: 250px;
        border-radius: 22px;
        margin-top: 20%;
      }

      .left img {
        width: 60%;
        height: auto;
        object-fit: contain;
      }

      .right {
        width: 100%;
        padding: 30px;
      }

      .btn {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .right h2 {
        font-size: 22px;
      }

      .form-group input, .form-group1 {
        font-size: 14px;
        padding: 10px 12px 10px 36px;
      }

      .form-group i {
        left: 10px;
        font-size: 14px;
      }

      .btn {
        font-size: 14px;
        padding: 12px;
      }
    }

    #eye {
      width: 25px;
      height: 25px;
      outline: none;
      border: none;
      background: transparent;
      align-self: center;
    }

    #box {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      padding-right: 14px;
    }


  </style>
</head>

<body>

  <div class="container">
    <div class="left">
      <img src="Assets/pic.png" alt="ALT">
    </div>
    <div class="right">
      <img src="Assets/LL.jpg" alt="LifeLink Logo" class="logo">
      <h2>Login</h2>
      <form>
        <div class="form-group">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="form-group1">
          <div id="box">
            <i id="lock" class="fas fa-lock"></i> 
            <input type="password" placeholder="Password" id="password" required style="border: none;width:100%">
            <button id="eye"><i id="icon" class="fa-solid fa-eye" style="color: #e31621;"></i></button>
          </div>
        </div>
        <button class="btn" type="submit">Login</button>
      </form>
      <div class="form-links">
        <p id="pass"><a href="#">Forgot Password ?</a></p>
        <p>Don't have an account? <a href="SignUp.html">Sign Up</a></p>
      </div>
    </div>
  </div>



<script src="/js/login.js"></script>
</body>

</html>
