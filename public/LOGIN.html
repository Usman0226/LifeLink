<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://kit.fontawesome.com/62301ddb39.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      height: 85%;
      display: flex;
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transition: background ease 1s;
    }

    .left {
      width: 50%;
      background: linear-gradient(to bottom, #e75d5d, rgba(214, 214, 214, 0.868));
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 22px;
    }

    .left img {
      width: 70%;
      height: 60%;
      object-fit: cover;
    }

    .form {
      width: 50%;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: white;
    }

    .logo {
      width: 30%;
      align-self: center;
      margin-bottom: 15px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    .details {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .sub_title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6.5px;
      margin-left: 2.3%;
      color: #333;
    }

    .details i {
      margin-right: 6px;
      color: #f44336;
    }

    .sty {
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
    }

    .sty1 {
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      width: 100%;
    }

    #box {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      padding-right: 14px;
    }

    .sty:focus,
    .sty:hover,
    #box:focus,
    #box:hover {
      border-color: #a23238;
      box-shadow: 0 0 0 3px rgba(244, 67, 54, 0.2);
    }

    #eye {
      width: 25px;
      height: 25px;
      outline: none;
      border: none;
      background: transparent;
      align-self: center;
    }

    .btn {
      align-self: center;
      background-color: #a23238;
      color: white;
      padding: 14px;
      border: none;
      width: 100%;
      max-width: 320px;
      border-radius: 22px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #a83238;
    }

    .form-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #222;
    }

    .form-links a {
      text-decoration: none;
      font-weight: 600;
      color: #000;
    }

    .form-links a:hover {
      color: #a23238;
      border-bottom: 1px solid rgb(33, 15, 15);
    }

    #pass {
      margin-bottom: 7px;
      font-weight: bold;
    }

    #btm{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      
    }

    @media (max-width: 700px) {
      .container {
        flex-direction: column;
        height: auto;
        width: 95%;
        border-radius: 0;
        box-shadow: none;
      }

      .left {
        width: 100%;
        height: 250px;
        border-radius: 22px;
        margin-top: 11%;
      }

      .left img {
        width: 50%;
        height: auto;
        object-fit: contain;
      }

      .form {
        width: 100%;
        padding: 0 30px;
      }

      .btn {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .title {
        font-size: 22px;
      }

      .sty,
      .sty1 {
        font-size: 14px;
        padding: 10px 12px;
      }

      .btn {
        font-size: 14px;
        padding: 12px;
      }

      .sub_title {
        font-size: 13px;
      }

      .left {
        height: 200px;
      }

      .left img {
        width: 60%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="left">
      <img src="Assets/pic.png" alt="ALT">
    </div>
    <div class="form">
      <img src="Assets/LL.jpg" alt="LifeLink Logo" class="logo">
      <p class="title">Login</p>
      <form method="post">
        <div class="details">
          <label class="sub_title"><i class="fas fa-envelope"></i> Email</label>
          <input id="email" type="email" placeholder="Email" class="sty" required>
        </div>
        <div class="details password_input">
          <label class="sub_title"><i class="fas fa-lock"></i> Password</label>
          <div id="box">
            <input type="password" placeholder="Password" id="password" class="sty1" style="border: none;" required>
            <button id="eye"><i id="icon" class="fa-solid fa-eye" style="color: #e31621;"></i></button>
          </div>
        </div>
        <div id="btm">
          <button  class="btn" type="submit" id="reset" style="display: none;">Next</button>
          <button class="btn" type="submit" id="log">Login</button>
          <div class="form-links">
            <p id="pass" ><a class="forget" href="#">Forgot Password?</a></p>
            <p>Don't have an account? <a href="SignUp.html">Sign Up</a></p>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- <script src="/public/js/login.js"></script> -->
  <script src="./js/login.js"></script>
  
</body>

</html>
